<title>AI Edu Training Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Theo thiết kế "AI Edu Training Hub": nền xám nhạt, thẻ trắng viền mảnh, nhấn xanh #2152C5. Giữ một giao diện sáng như bản thiết kế. */
:root {
  --bg: #F6F7F9; --surface: #FFFFFF; --ink: #172033; --muted: #4B5565;
  --line: #E3E6EB; --edge: #CDD2DA; --accent: #2152C5; --accent-dark: #163B91;
  --accent-soft: #E8EEFB; --row-hi: #F3F6FD;
  --ok: #1D6E47; --ok-soft: #E2F3EA; --warn: #7A4B00; --warn-soft: #FFF4DB;
  --err: #8A3A0C; --err-soft: #FCECE3; --err-bar: #C2410C; --grey-soft: #EEF0F3;
  --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
a { color: var(--accent); } a:hover { color: var(--accent-dark); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gut { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1200px; margin: 0 auto; }
.ico { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Thanh chuyển khu của bản mẫu */
.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--ink); color: #DCE3EE; font-size: 13px; }
.proto .wrap { display: flex; align-items: center; gap: 14px; padding-block: 7px; flex-wrap: wrap; max-width: none; }
.proto b { color: #FFFFFF; font-weight: 600; }
.proto nav { display: flex; gap: 4px; margin-left: auto; }
.proto a { color: #DCE3EE; text-decoration: none; padding: 4px 10px; border-radius: 6px; }
.proto a[aria-current] { background: #FFFFFF; color: var(--ink); font-weight: 600; }

/* Buttons, chips */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: #FFFFFF; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--accent-dark); border-color: var(--accent-dark); color: #FFFFFF; }
.btn.ghost { background: var(--surface); border-color: var(--edge); color: var(--ink); }
.btn.ghost:hover { background: var(--bg); color: var(--ink); }
.btn.block { width: 100%; min-height: 48px; font-size: 16px; }
.btn[disabled] { background: var(--line); border-color: var(--line); color: var(--muted); cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 99px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
input[type="search"], input[type="text"], input[type="number"], select, textarea { background: var(--surface); border: 1px solid var(--edge); border-radius: 10px; padding: 0 12px; min-height: 44px; font-size: 15px; }
textarea { padding: 10px 12px; resize: vertical; min-height: 78px; width: 100%; }
input[type="checkbox"], input[type="radio"] { width: 18px; height: 18px; accent-color: var(--accent); flex: none; margin: 0; }

/* ========== Public site ========== */
.pub-head { background: var(--surface); border-bottom: 1px solid var(--line); }
.pub-head .wrap { display: flex; align-items: center; gap: 24px; padding-block: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand .logo { width: 36px; height: 36px; border-radius: 8px; background: var(--accent); color: #FFFFFF; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.brand .name { font-weight: 700; font-size: 18px; } .brand .name span { font-weight: 500; color: var(--muted); }
.mainnav { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
.mainnav a { padding: 12px 14px; border-radius: 8px; color: var(--ink); font-weight: 500; text-decoration: none; }
.mainnav a[aria-current] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.who { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--line); color: var(--ink); display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; }
.band { background: var(--surface); border-bottom: 1px solid var(--line); }
.band .wrap { padding-block: 40px 32px; display: grid; gap: 16px; }
.band h1 { font-size: clamp(30px, 4vw, 40px); line-height: 1.15; }
.band p.lead { margin: 0; font-size: 17px; line-height: 1.6; color: var(--muted); max-width: 720px; }
.search { display: flex; align-items: center; gap: 10px; background: var(--bg); border: 1px solid var(--edge); border-radius: 10px; padding: 0 14px; height: 48px; max-width: 560px; margin-top: 8px; color: var(--muted); }
.search input { border: 0; outline: none; background: transparent; flex: 1; min-width: 0; padding: 0; min-height: 44px; color: var(--ink); }
.search:focus-within { border-color: var(--accent); }

.cat { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 32px; padding-block: 32px 48px; align-items: start; }
.filters { padding: 20px; display: grid; gap: 20px; }
.filters .hd { display: flex; justify-content: space-between; align-items: center; min-height: 32px; }
.filters h2 { font-size: 17px; }
.linkbtn { border: 0; background: transparent; color: var(--accent); font-weight: 600; font-size: 14px; cursor: pointer; padding: 0 4px; min-height: 32px; }
.fgroup { display: grid; gap: 2px; border: 0; padding: 0; margin: 0; }
.fgroup legend { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; padding: 0; }
.fgroup label { display: flex; align-items: center; gap: 10px; min-height: 40px; cursor: pointer; }
.fgroup .n { margin-left: auto; font-size: 13px; color: var(--muted); }
.fgroup label.zero { color: var(--muted); }
.ftoggle { display: none; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar label { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
.toolbar select { min-width: 190px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.chips button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--edge); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
.ccard { display: flex; flex-direction: column; overflow: hidden; text-decoration: none; color: var(--ink); transition: border-color .15s, box-shadow .15s; }
.ccard:hover { color: var(--ink); border-color: var(--accent); box-shadow: 0 4px 16px rgba(23, 32, 51, .08); }
.ccard .top { height: 128px; display: grid; place-items: center; position: relative; }
.ccard .badge { position: absolute; left: 14px; top: 12px; background: var(--surface); color: var(--ink); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; box-shadow: 0 1px 2px rgba(23, 32, 51, .1); }
.ccard .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.ccard h3 { font-size: 19px; line-height: 1.3; }
.ccard p { margin: 0; font-size: 14.5px; color: var(--muted); line-height: 1.55; }
.ccard .foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); display: grid; gap: 6px; font-size: 13.5px; color: var(--muted); }
.ccard .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.ccard .meta span { display: inline-flex; align-items: center; gap: 5px; }
.empty { padding: 48px 24px; text-align: center; display: grid; gap: 12px; justify-items: center; color: var(--muted); border: 1px dashed var(--edge); border-radius: 12px; background: var(--surface); }
.empty b { color: var(--ink); font-size: 17px; }
.cta-band { padding: 28px 32px; display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 48px; }
.cta-band h2 { font-size: 24px; margin-bottom: 6px; }
.cta-band p { margin: 0; color: var(--muted); }
.pub-foot { background: var(--surface); border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.pub-foot .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-block: 22px; }
.pub-foot nav { display: flex; gap: 20px; } .pub-foot a { color: var(--muted); }

/* Detail */
.dhead { background: var(--surface); border-bottom: 1px solid var(--line); }
.dhead .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 48px; padding-block: 24px 40px; align-items: start; }
.crumbs { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); margin-bottom: 14px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); }
.dhead h1 { font-size: clamp(28px, 3.6vw, 40px); line-height: 1.15; margin-block: 12px 18px; }
.dhead .lead { margin: 0 0 22px; font-size: 17px; line-height: 1.6; color: var(--muted); max-width: 700px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 26px; font-size: 15px; color: var(--ink); }
.facts span { display: inline-flex; align-items: center; gap: 8px; }
.prog-card { background: var(--bg); padding: 22px 24px; display: grid; gap: 14px; }
.prog-card .row1 { display: flex; justify-content: space-between; font-weight: 600; font-size: 14px; }
.prog-card .now { font-size: 14px; color: var(--muted); margin-top: -4px; }
.dbody { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 32px; padding-block: 32px 56px; align-items: start; }
.dbody .main, .dbody .side { display: grid; gap: 32px; }
.sec { padding: 28px; }
.sec h2 { font-size: 22px; margin-bottom: 18px; }
.learn { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 32px; margin: 0; padding: 0; list-style: none; }
.learn li { display: flex; gap: 12px; } .learn svg { color: var(--ok); margin-top: 2px; }
.mods { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.mod + .mod { border-top: 1px solid var(--line); }
.mod button.mh { width: 100%; display: grid; grid-template-columns: 32px minmax(0, 1fr) 20px; gap: 14px; align-items: center; text-align: left; border: 0; background: transparent; padding: 16px 18px; cursor: pointer; }
.mod.cur { background: var(--row-hi); }
.mod .dot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.mod .t { font-weight: 600; font-size: 16px; } .mod .s { font-size: 13px; color: var(--muted); }
.mod .chev { transition: transform .15s; color: var(--muted); }
.mod.open .chev { transform: rotate(180deg); }
.mod ul { margin: 0; padding: 0 18px 18px 80px; display: grid; gap: 8px; color: var(--ink); }
.mod li::marker { color: #9AA3B2; }
.info { padding: 22px 24px; display: grid; gap: 10px; }
.info h2 { font-size: 18px; margin-bottom: 6px; }
.info dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 10px 22px; font-size: 14.5px; }
.info dt { color: var(--muted); } .info dd { margin: 0; }
.related { display: grid; gap: 16px; } .related a { font-weight: 600; text-decoration: none; }

/* Mine */
.mhead .wrap { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 40px 0; }
.mhead h1 { font-size: clamp(28px, 3.6vw, 40px); margin-bottom: 6px; }
.tabs { display: flex; gap: 8px; margin-top: 24px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 14px 16px; display: inline-flex; gap: 8px; align-items: center; font-size: 16px; color: var(--muted); font-weight: 500; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }
.tabs .c { background: var(--grey-soft); border-radius: 99px; font-size: 12px; padding: 1px 8px; font-weight: 600; color: var(--ink); }
.mlist { display: grid; gap: 16px; padding-block: 32px 56px; }
.mrow { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 20px; align-items: center; padding: 20px; }
.mrow .thumb { width: 96px; height: 96px; border-radius: 10px; display: grid; place-items: center; }
.mrow .tp { font-size: 13px; font-weight: 600; } .mrow h3 { font-size: 19px; margin-block: 4px 6px; }
.mrow .note { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
.mrow .pr { display: flex; align-items: center; gap: 12px; max-width: 470px; font-weight: 600; font-size: 14px; } .mrow .pr .bar { flex: 1; }
.mrow .acts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

/* ========== Internal ========== */
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100vh - 36px); }
.sidebar { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 16px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 36px); height: calc(100vh - 36px); }
.sidebar .brand { padding: 0 8px 16px; } .sidebar .name { font-size: 17px; }
.tag-inb { background: var(--ink); color: #FFFFFF; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 5px; margin-left: 4px; }
.sidebar nav { display: grid; gap: 4px; }
.sidebar nav a { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 8px; color: var(--ink); text-decoration: none; font-weight: 500; }
.sidebar nav a[aria-current] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.sidebar .pub { border-top: 1px solid var(--line); margin-top: 12px; padding: 18px 12px 0; font-size: 14px; color: var(--muted); }
.sidebar .pub a { color: var(--muted); }
.sidebar .me { margin-top: auto; display: flex; gap: 10px; align-items: center; font-size: 14px; padding: 0 8px; }
.sidebar .me b { display: block; font-size: 14px; }
.ws { padding-block: 32px 56px; max-width: 1060px; width: 100%; }
.ws-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.ws-head h1 { font-size: clamp(26px, 3vw, 32px); margin-bottom: 8px; }
.ws-head p { margin: 0; color: var(--muted); max-width: 760px; }
.seg { display: inline-flex; background: var(--line); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 24px; }
.seg button { border: 0; background: transparent; padding: 10px 18px; border-radius: 9px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(23, 32, 51, .08); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
.panel { padding: 20px; }
.panel h2 { font-size: 18px; }
.panel .sub { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; margin-bottom: 8px; }
.path { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.tree { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.tree .r { display: flex; align-items: center; gap: 12px; min-height: 45px; padding-right: 14px; border-top: 1px solid var(--line); }
.tree .r:first-child { border-top: 0; }
.tree button.g { border: 0; background: transparent; width: 100%; display: flex; align-items: center; gap: 12px; min-height: 45px; cursor: pointer; font-weight: 600; text-align: left; padding: 0; }
.tree .g svg { transition: transform .15s; color: var(--muted); }
.tree .open > .g svg { transform: rotate(90deg); }
.tree label { display: flex; align-items: center; gap: 12px; flex: 1; min-height: 45px; cursor: pointer; }
.tree .r.sel { background: var(--row-hi); }
.tree .m { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; }
.tree .note { font-size: 13.5px; color: var(--muted); font-style: italic; }
.stack { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.ql > *, .ql-top .rh > * { min-width: 0; }
.field { display: grid; gap: 8px; } .field > b, .field > label > b { font-size: 15px; }
.opt { display: flex; align-items: center; gap: 10px; min-height: 40px; cursor: pointer; }
.opt .nt { margin-left: auto; font-size: 13px; color: var(--muted); }
.selitem { display: flex; justify-content: space-between; align-items: center; background: var(--bg); border-radius: 8px; padding: 10px 12px; font-size: 14.5px; }
.selitem button { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px; }
.callout { padding: 10px 14px; border-radius: 8px; font-size: 14px; }
.result ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14.5px; }
.formgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.formgrid .full { grid-column: 1 / -1; }
.formgrid select, .formgrid input[type="text"] { width: 100%; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 24px; max-width: 800px; }
.stat { padding: 18px 20px; } .stat span { font-size: 14px; color: var(--muted); } .stat b { display: block; font-size: 28px; line-height: 1.2; }
.runs { display: grid; gap: 16px; }
.run { padding: 22px 20px; display: grid; gap: 16px; }
.run .rh { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.run h3 { font-size: 19px; } .run .meta { font-size: 14px; color: var(--muted); }
.steps { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.steps div { display: grid; gap: 6px; font-size: 13.5px; } .steps i { height: 5px; border-radius: 99px; display: block; }
.run .acts { display: flex; gap: 10px; flex-wrap: wrap; }
.report { background: var(--bg); border-radius: 8px; padding: 14px 16px; font-size: 14px; display: grid; gap: 4px; }
.foot-note { font-size: 13.5px; color: var(--muted); margin-top: 20px; }

.stabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.stabs button { border: 1px solid var(--edge); background: var(--surface); border-radius: 99px; padding: 8px 14px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 8px; }
.stabs button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #FFFFFF; }
.fbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.fbar input { flex: 1 1 260px; max-width: 360px; } .fbar label { display: flex; gap: 10px; align-items: center; color: var(--muted); }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; min-width: 860px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 14px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td .tt { font-weight: 600; } td .tp { font-size: 13px; color: var(--muted); }
td a { font-weight: 600; }

.review { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.doc { padding: 32px; }
.doc .dh { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding-bottom: 12px; border-bottom: 2px solid #A51D45; margin-bottom: 24px; gap: 12px; flex-wrap: wrap; }
.doc h2.title { color: #A51D45; font-size: 24px; margin-bottom: 20px; }
.doc h3 { font-size: 16px; margin-block: 18px 8px; } .doc h4 { font-size: 15px; margin: 10px 0 6px; }
.doc ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.doc .ph { color: var(--muted); }
.doc table { min-width: 560px; font-size: 14px; border: 1px solid #E8B9C6; }
.doc th { background: #F7E4EA; color: var(--ink); border: 1px solid #E8B9C6; }
.doc td { border: 1px solid #E8B9C6; vertical-align: top; }
.rtabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--line); padding: 4px; border-radius: 12px; gap: 4px; margin-bottom: 16px; }
.rtabs button { border: 0; background: transparent; border-radius: 9px; padding: 10px; font-weight: 600; color: var(--muted); cursor: pointer; }
.rtabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
.checks { display: grid; gap: 12px; } .checks div { display: grid; grid-template-columns: 74px 1fr; gap: 12px; font-size: 14.5px; align-items: start; }

/* ================= Public: catalog ================= */
function matches(c, skip) {
  const s = S;
  if (s.q && !fold(c.title + ' ' + c.desc).includes(fold(s.q))) return false;
  if (skip !== 'aud' && s.f.aud.length && !s.f.aud.some(a => c.aud.includes(a))) return false;
  if (skip !== 'topic' && s.f.topic.length && !s.f.topic.includes(c.topic)) return false;
  if (skip !== 'dur' && s.f.dur.length && !s.f.dur.includes(durBucket(c))) return false;
  if (skip !== 'fmt' && s.f.fmt.length && !s.f.fmt.includes(c.fmt)) return false;
  return true;
}
const FDEFS = [
  { key: 'aud', title: 'Đối tượng', map: AUD, test: (c, v) => c.aud.includes(v) },
  { key: 'topic', title: 'Chủ đề', map: Object.fromEntries(Object.entries(TOPICS).map(([k, v]) => [k, v.label])), test: (c, v) => c.topic === v },
  { key: 'dur', title: 'Thời lượng', map: DUR, test: (c, v) => durBucket(c) === v },
  { key: 'fmt', title: 'Hình thức', map: FMT, test: (c, v) => c.fmt === v }
];
function courseCard(c) {
  const t = TOPICS[c.topic], st = status(c), p = prog(c);
  const badge = st === 'learning' ? `Đang học · ${p}%` : st === 'done' ? 'Đã hoàn thành' : st === 'saved' ? 'Đã lưu' : '';
  return `<a class="card ccard" href="#kh-${c.id}">
    <div class="top" style="background:${t.tint};color:${t.ink}">${badge ? `<span class="badge">${badge}</span>` : ''}${ico(c.topic, 40)}</div>
    <div class="body">

        <div class="meta"><span>${ico('clock', 15)}${c.h[0]}–${c.h[1]} giờ</span><span>${FMT[c.fmt]}</span><span>${c.level}</span></div>

}

/* ================= Internal: Tiến độ ================= */
function viewTienDo() {
  const chipOf = r => ({ done: ['Xong · ' + (r.version || 'v1'), 'var(--ok-soft)', 'var(--ok)', 'var(--line)'], running: ['Đang chạy', 'var(--accent-soft)', 'var(--accent-dark)', '#C9D6F5'], error: ['Lỗi', 'var(--err-soft)', 'var(--err)', '#F2C7AE'], queued: ['Đang chờ', 'var(--grey-soft)', 'var(--muted)', 'var(--line)'] }[r.status]);
  const count = k => RUNS.filter(r => r.status === k).length;
  const stats = [['Xong', count('done'), 'var(--ok)'], ['Đang chạy', count('running'), 'var(--accent-dark)'], ['Lỗi', count('error'), 'var(--err)'], ['Đang chờ', count('queued'), 'var(--muted)']];
  const runs = RUNS.map(r => {
    const c = chipOf(r), open = S.reports.includes(r.id);
    const steps = STEPS.map((label, i) => {
      const st = r.status === 'done' ? 'done' : r.status === 'queued' ? 'todo' : i < r.at ? 'done' : i === r.at ? (r.status === 'error' ? 'error' : 'now') : 'todo';
      const bar = { done: 'var(--ok)', now: 'var(--accent)', error: 'var(--err-bar)', todo: 'var(--line)' }[st];
      return `<div style="color:${st === 'todo' ? 'var(--muted)' : 'var(--ink)'};font-weight:${st === 'now' || st === 'error' ? 700 : 500}"><i style="background:${bar}"></i>${label}</div>`;
    }).join('');
    return `<article class="card run" style="border-color:${c[3]}">
      <div class="rh"><div><h3>${esc(r.title)}</h3><div class="meta">${esc(r.meta)}</div></div><span class="pill" style="background:${c[1]};color:${c[2]}">${c[0]}</span></div>
      <div class="steps">${steps}</div>
      ${r.status === 'error' ? `<div class="callout" style="background:var(--err-soft);color:var(--err)">${esc(r.error)}</div>` : ''}
      ${open ? `<div class="report"><b>Báo cáo đối chiếu</b><span>Mã 2422: 6.1.a, 6.1.c (đúng lớp 6) · CV 5588: đủ 4 hoạt động · 1 cảnh báo: thiếu bước nhắc HS khai báo khi dùng AI.</span><span class="muted">Bản mẫu: báo cáo thật do Claude ghi sau bước Kiểm tra.</span></div>` : ''}
      ${r.status === 'done' ? `<div class="acts"><a class="btn" href="#noi-bo-duyet">Mở để duyệt</a><button type="button" class="btn ghost" data-act="report" data-v="${r.id}">${open ? 'Ẩn báo cáo' : 'Xem báo cáo'}</button></div>` : ''}
      ${r.status === 'error' ? `<div class="acts"><button type="button" class="btn" data-act="retry" data-v="${r.id}">Chạy lại từ bước lỗi</button></div>` : ''}
      ${r.status === 'queued' ? `<div class="acts"><button type="button" class="btn ghost" data-act="cancel" data-v="${r.id}">Huỷ bài này</button></div>` : ''}
    </article>`;
  }).join('');
  return inbShell('noi-bo-tien-do', `
    <div class="ws-head"><div><h1>Tiến độ soạn</h1><p>Lượt chạy ngày [dd/mm/yyyy] · ${RUNS.length} bài · trang tự cập nhật khi Claude xong từng bước</p></div><button type="button" class="btn ghost">Mở Nhật ký chạy của ngày</button></div>
    <div class="stats">${stats.map(([l, v, c]) => `<div class="card stat"><span>${l}</span><b class="num" style="color:${c}">${v}</b></div>`).join('')}</div>
    <div class="runs">${runs || '<div class="empty"><b>Chưa có lượt chạy nào hôm nay</b><a class="btn" href="#noi-bo-tao">Tạo KHBD</a></div>'}</div>
    <p class="foot-note">Nhật ký chạy: Google Sheet trong thư mục ngày của AI Agent, mỗi bài một dòng (giờ bắt đầu, giờ kết thúc, số phút, lớp, chủ đề, bài, số tiết, bản KHBD, link, cảnh báo). Trong bản mẫu, các bước tự chạy giả lập vài giây một bước.</p>`);
}

/* ================= Internal: Danh sách ================= */
function dsRows() {
  const d = S.ds;
  const base = ITEMS.filter(it => (!d.q || fold(it.title).includes(fold(d.q))) && (d.grade === 'all' || String(it.grade) === d.grade) && (d.source === 'all' || it.source === d.source));
  const keys = ['all', 'draft', 'review', 'fix', 'approved', 'pbt', 'error'];

      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span class="pill" style="background:${status[1]};color:${status[2]}">${status[0]}</span>
        <select aria-label="Phiên bản"><option>v1 (bản mới nhất)</option></select><button type="button" class="btn ghost">Mở Google Doc</button></div></div>
    <div class="review">
      <article class="card doc">
        <div class="dh"><span>[Logo] Kế hoạch giảng dạy</span><span>Bản xem trước · Do Claude soạn · v1</span></div>
        <h2 class="title">Bài 3. AI tạo sinh</h2>

const staleCount = c => c.modules.reduce((n, m) => n + m.lessons.reduce((k, l) => k + l.mats.filter(mt => latestOk(DOCS[mt.doc]) > mt.v).length, 0), 0);
const nLes = c => c.modules.reduce((n, m) => n + m.lessons.length, 0);
(() => { const gd = byId('gd-ai-thcs');
  gd.modules[0].lessons[2].mats.push({ doc: 'b1', v: 1 });
  gd.modules[1].lessons[2].mats.push({ doc: 'b2', v: 1 });
  gd.modules[2].lessons[1].mats.push({ doc: 'b10', v: 1 }); })();

          <label class="field" for="c-topic"><b>Chủ đề</b><select id="c-topic" data-in="course.topic" ${dis}>${opt(Object.fromEntries(Object.entries(TOPICS).map(([k, v]) => [k, v.label])), c.topic)}</select></label>
          <label class="field" for="c-fmt"><b>Hình thức</b><select id="c-fmt" data-in="course.fmt" ${dis}>${opt(FMT, c.fmt)}</select></label>
          <label class="field" for="c-level"><b>Trình độ</b><select id="c-level" data-in="course.level" ${dis}>${opt({ 'Cơ bản': 'Cơ bản', 'Nâng cao': 'Nâng cao' }, c.level)}</select></label>
          <div class="field"><b>Thời lượng (giờ)</b><div class="hrs"><input type="number" min="0" id="c-h0" data-in="course.h0" value="${c.h[0]}" aria-label="Từ (giờ)" ${dis}><span>đến</span><input type="number" min="0" id="c-h1" data-in="course.h1" value="${c.h[1]}" aria-label="Đến (giờ)" ${dis}></div></div>
          <fieldset class="field full" style="border:0;padding:0;margin:0"><legend style="padding:0"><b>Đối tượng</b></legend><div class="audrow">${Object.entries(AUD).map(([k, v]) => `<label class="opt" for="c-aud-${k}"><input type="checkbox" id="c-aud-${k}" data-act="aud" data-v="${k}" ${c.aud.includes(k) ? 'checked' : ''} ${dis}>${v}</label>`).join('')}</div></fieldset>
        </div></section>
        <section class="card panel stack"><div class="sub" style="margin:0"><h2>Học phần và bài</h2><span class="muted" style="font-size:13.5px">Học liệu là KHBD, PBT đã duyệt ở khu nội bộ</span></div>
          ${mods}${editable ? '<button type="button" class="btn ghost" style="justify-self:start" data-act="madd">+ Thêm học phần</button>' : ''}</section>
        <section class="card panel stack"><h2>Chứng nhận</h2>
          <label class="opt" for="c-cert"><input type="checkbox" id="c-cert" disabled>Cấp chứng nhận PDF có mã xác minh khi hoàn thành</label>
          <p class="muted" style="margin:0;font-size:14px">Chưa cấp ở bản đầu: giáo viên học xong chỉ thấy “Đã hoàn thành” trên web. Mẫu chứng nhận, người ký và giá trị với trường, sở chờ công ty chốt.</p></section>
      </div>
    </div>`);
}

/* ================= Router ================= */
const app = document.getElementById('app');
function route() {
  const h = location.hash.slice(1) || 'khoa-hoc';
  const inb = h.startsWith('noi-bo');
  document.getElementById('sw-pub').toggleAttribute('aria-current', !inb);
  document.getElementById('sw-inb').toggleAttribute('aria-current', inb);
  let html, title = 'AI Edu Training Hub';
  if (h.startsWith('kh-') && byId(h.slice(3))) { const c = byId(h.slice(3)); html = viewDetail(c); title = c.title + ' · AI Edu'; }
  else if (h === 'cua-toi') html = viewMine();
  else if (h === 'noi-bo-tao') html = viewTao();
  else if (h === 'noi-bo-tien-do') html = viewTienDo();
  else if (h === 'noi-bo-danh-sach') html = viewDanhSach();
  else if (h === 'noi-bo-duyet') html = viewDuyet();
  else if (h === 'noi-bo-khoa-hoc') html = viewQuanLy();
  else if (h === 'tro-giup') html = pubShell('', `<div class="wrap gut" style="padding-block:48px"><div class="empty"><b>Trang Trợ giúp chưa có trong bản mẫu</b><span>Trang này sẽ có câu hỏi thường gặp, liên hệ hỗ trợ, điều khoản và quyền riêng tư.</span><a class="btn" href="#khoa-hoc">Về danh mục khoá học</a></div></div>`);
  else html = viewCatalog();
  document.title = title;
  app.innerHTML = html;
}
const rerender = () => { const y = scrollY; route(); scrollTo(0, y); };
const curCourse = () => byId(location.hash.slice(4));

/* ================= Events ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  const tog = (arr, x) => arr.includes(x) ? arr.filter(y => y !== x) : arr.concat([x]);
  switch (a) {
    case 'ftoggle': S.f[el.dataset.k] = tog(S.f[el.dataset.k], v); document.getElementById('filters').innerHTML = filtersHtml(); document.getElementById('results').innerHTML = catResults(); return;
    case 'clearq': S.q = ''; return rerender();
    case 'clearall': S.q = ''; S.f = { aud: [], topic: [], dur: [], fmt: [] }; return rerender();
    case 'fpanel': S.filtersOpen = !S.filtersOpen; return rerender();
    case 'mod': { const c = curCourse(), i = +el.dataset.i; S.open[c.id] = tog(S.open[c.id], i); return rerender(); }
    case 'modall': { const c = curCourse(); S.open[c.id] = S.open[c.id].length === c.mods.length ? [] : c.mods.map((_, i) => i); return rerender(); }
    case 'enroll': { const c = curCourse(); store.learn[c.id] = { done: 0 }; S.open[c.id] = [0]; persist(); return rerender(); }
    case 'next': { const c = curCourse(), l = store.learn[c.id]; l.done = Math.min(c.mods.length, l.done + 1); S.open[c.id] = l.done < c.mods.length ? [l.done] : []; persist(); return rerender(); }
    case 'reset': { const c = curCourse(); store.learn[c.id] = { done: 0 }; S.open[c.id] = [0]; persist(); return rerender(); }
    case 'save': { const c = curCourse(); store.saved = tog(store.saved, c.id); persist(); return rerender(); }
    case 'minetab': S.mineTab = v; return rerender();
    case 'mode': S.tao.mode = v; return rerender();
    case 'expand': S.tao.expanded = tog(S.tao.expanded, v); return rerender();
    case 'pick': S.tao.selected = tog(S.tao.selected, v); return rerender();
    case 'format': S.tao.format = v; return;
    case 'codemode': S.tao.codeMode = v; return rerender();
    case 'base': S.tao.bases[v] = !S.tao.bases[v]; return;
    case 'run': {
      const t = S.tao;
      const items = t.mode === 'kho' ? t.selected.map(k => { const l = lessonInfo(k); return { id: l.id + '-' + Date.now(), title: l.name, meta: `Lớp ${l.lop} · ${l.cd} · ${l.tiet} tiết · đang chờ` }; })
        : [{ id: 'moi-' + Date.now(), title: t.lessonName || '[Tên bài mới]', meta: `Lớp ${t.grade} · ${t.periods} tiết · bài mới · đang chờ` }];
      items.forEach(x => RUNS.push({ ...x, status: 'queued', at: 0 }));
      t.selected = []; location.hash = 'noi-bo-tien-do'; return;
    }
    case 'report': S.reports = tog(S.reports, v); return rerender();
    case 'retry': { const r = RUNS.find(x => x.id === v); r.status = 'running'; r.error = ''; return rerender(); }
    case 'cancel': RUNS = RUNS.filter(x => x.id !== v); return rerender();
    case 'dstab': S.ds.tab = v; document.getElementById('ds-tabs').innerHTML = dsRows().tabs; document.getElementById('ds-table').innerHTML = dsRows().table; return;
    case 'dvtab': S.dv.tab = v; return rerender();
    case 'qlsel': S.ql.sel = v; S.ql.picker = null; return rerender();
    case 'qlnew': { const id = 'khoa-moi-' + Date.now().toString(36);
      COURSES.push({ id, title: 'Khoá học mới', desc: '', topic: 'ai', aud: [], h: [1, 2], fmt: 'self', level: 'Cơ bản', status: 'draft', learn: [], who: '', modules: [{ title: 'Học phần 1', lessons: [{ title: 'Bài 1', mats: [] }] }] });
      Object.defineProperty(byId(id), 'mods', { get() { return this.modules.map(m => [m.title, m.lessons.map(l => l.title)]); } });
      S.ql.sel = id; S.ql.q = ''; return rerender(); }
    case 'qlstatus': if (S.ql.role === 'lead') qlCourse().status = v; return rerender();
    case 'aud': { const c = qlCourse(); c.aud = tog(c.aud, v); return; }
    case 'mup': case 'mdown': { const M = qlCourse().modules, i = +el.dataset.i, k = a === 'mup' ? i - 1 : i + 1; [M[i], M[k]] = [M[k], M[i]]; S.ql.picker = null; return rerender(); }
    case 'mdel': qlCourse().modules.splice(+el.dataset.i, 1); S.ql.picker = null; return rerender();
    case 'madd': qlCourse().modules.push({ title: 'Học phần mới', lessons: [{ title: 'Bài mới', mats: [] }] }); return rerender();
    case 'lup': case 'ldown': { const L = qlCourse().modules[+el.dataset.i].lessons, j = +el.dataset.j, k = a === 'lup' ? j - 1 : j + 1; [L[j], L[k]] = [L[k], L[j]]; S.ql.picker = null; return rerender(); }
    case 'ldel': qlCourse().modules[+el.dataset.i].lessons.splice(+el.dataset.j, 1); S.ql.picker = null; return rerender();
    case 'ladd': qlCourse().modules[+el.dataset.i].lessons.push({ title: 'Bài mới', mats: [] }); return rerender();
    case 'picker': S.ql.picker = S.ql.picker === v ? null : v; return rerender();
    case 'matadd': qlCourse().modules[+el.dataset.i].lessons[+el.dataset.j].mats.push({ doc: v, v: latestOk(DOCS[v]) }); S.ql.picker = null; return rerender();
    case 'matdel': qlCourse().modules[+el.dataset.i].lessons[+el.dataset.j].mats.splice(+el.dataset.k, 1); return rerender();
    case 'matup': { const mt = qlCourse().modules[+el.dataset.i].lessons[+el.dataset.j].mats[+el.dataset.k]; mt.v = latestOk(DOCS[mt.doc]); return rerender(); }
    case 'score': { const i = +el.dataset.i, val = v === 'na' ? 'na' : +v; S.dv.scores[i] = S.dv.scores[i] === val ? undefined : val; return rerender(); }
    case 'addnote': if (!S.dv.draft.trim()) return; S.dv.notes.push({ meta: 'Bạn · vừa xong', text: S.dv.draft.trim() }); S.dv.draft = ''; return rerender();
    case 'approve': S.dv.decision = 'approved'; ITEMS.find(x => x.id === 'b3').status = 'approved'; DOCS.b3.versions[0].st = 'approved'; return rerender();
    case 'sendback': S.dv.decision = 'back'; S.dv.tab = 'notes'; ITEMS.find(x => x.id === 'b3').status = 'fix'; DOCS.b3.versions[0].st = 'fix'; return rerender();
    case 'undo': S.dv.decision = null; ITEMS.find(x => x.id === 'b3').status = 'review'; DOCS.b3.versions[0].st = 'review'; return rerender();
  }
});
document.addEventListener('input', e => {
  const k = e.target.dataset.in; if (!k) return;
  const val = e.target.value;
  if (k === 'q') { S.q = val; document.getElementById('filters').innerHTML = filtersHtml(); document.getElementById('results').innerHTML = catResults(); return; }
  if (k === 'sort') return;
  if (/^(course|mod|les)\./.test(k)) {
    const c = qlCourse(), p = k.split('.');
    if (p[0] === 'course') { if (p[1] === 'h0' || p[1] === 'h1') c.h[p[1] === 'h0' ? 0 : 1] = Math.max(0, +val || 0); else c[p[1]] = val; }
    else if (p[0] === 'mod') c.modules[+p[1]].title = val;
    else c.modules[+p[1]].lessons[+p[2]].title = val;
    if (k === 'course.title') document.querySelector('.ql-top h2').textContent = val;
    return;
  }
  const [obj, field] = k.split('.');
  if (k === 'ql.q') { S.ql.q = val; document.getElementById('ql-list').innerHTML = qlListHtml(); return; }
  S[obj][field] = val;
  if (k === 'ds.q') { const r = dsRows(); document.getElementById('ds-tabs').innerHTML = r.tabs; document.getElementById('ds-table').innerHTML = r.table; }
});
document.addEventListener('change', e => {
  const k = e.target.dataset.in; if (!k) return;
  const val = e.target.value;
  if (k === 'sort') { S.sort = val; document.getElementById('results').innerHTML = catResults(); return; }
  if (k === 'ql.role') { S.ql.role = val; S.ql.picker = null; return rerender(); }
  if (k === 'course.title' || k === 'course.h0' || k === 'course.h1') { document.getElementById('ql-list').innerHTML = qlListHtml(); return; }
  if (k === 'tao.grade') { S.tao.grade = val; S.tao.topic = parseInt(val, 10) <= 5 ? 'ngoai' : '0'; return rerender(); }
  if (k === 'ds.grade' || k === 'ds.source') { const [o, f] = k.split('.'); S[o][f] = val; const r = dsRows(); document.getElementById('ds-tabs').innerHTML = r.tabs; document.getElementById('ds-table').innerHTML = r.table; }
});

/* Giả lập Claude chạy từng bước ở màn Tiến độ */
setInterval(() => {
  let changed = false;
  const running = RUNS.find(r => r.status === 'running');
  if (running) { running.at++; changed = true; if (running.at >= STEPS.length) { running.status = 'done'; running.version = 'v1'; running.meta = running.meta.replace(' · đang chờ', '') + ' · [x] phút'; } }
  else { const q = RUNS.find(r => r.status === 'queued'); if (q) { q.status = 'running'; q.meta = q.meta.replace('đang chờ', 'bắt đầu [hh:mm]'); changed = true; } }
  if (changed && location.hash === '#noi-bo-tien-do') rerender();
}, 2500);

addEventListener('hashchange', () => { route(); scrollTo(0, 0); });
route();
</script>
